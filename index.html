    * { box-sizing: border-box; }

    body[data-theme="mint"] { --ink: #f3f3f0; --white: #000028; --mint: #000028; --muted: #173b40; --line: #008a71; --amber: #683100; --rose: #860f33; }

    .timer[data-urgent="true"] .clock { color: var(--amber); }

    .timer[data-status="finished"] .clock { color: var(--rose); }

    .session-options { position: absolute; z-index: 5; top: calc(100% + 8px); left: 0; width: 280px; max-width: calc(100vw - 40px); padding: 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px #0006; }

  </style>

    let timers = panels.map(() => Array.from({length: 2}, () => ({remaining: duration, deadline: null})));
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && Number.isInteger(saved.selectedPanel) && saved.selectedPanel >= 0 && saved.selectedPanel < panels.length &&
          Array.isArray(saved.timers) && saved.timers.length === panels.length && saved.timers.every(pair =>
            Array.isArray(pair) && pair.length === 2 && pair.every(timer => timer && Number.isFinite(timer.remaining) && timer.remaining >= 0 && timer.remaining <= duration &&
              (timer.deadline === null || (Number.isFinite(timer.deadline) && timer.deadline > 0))))) {
        selectedPanel = saved.selectedPanel;
        selectedScreen = program.findIndex(screen => screen.panel === selectedPanel);
        if (Number.isInteger(saved.selectedScreen) && saved.selectedScreen >= 0 && saved.selectedScreen < program.length &&
          (program[saved.selectedScreen].panel === undefined || program[saved.selectedScreen].panel === selectedPanel)) selectedScreen = saved.selectedScreen;
        sequenceEnded = saved.sequenceEnded === true && selectedScreen === program.length - 1;
        timers = saved.timers;
        steps = Array.isArray(saved.steps) && saved.steps.length === panels.length && saved.steps.every(step => Number.isInteger(step) && step >= 0 && step <= 3)
          ? saved.steps
          : timers.map(pair => pair.reduce((step, timer, index) => timer.deadline !== null || timer.remaining < duration ? index + 1 : step, 0));
        timers.forEach((pair, panelIndex) => {
          const runningRounds = pair.map((timer, index) => timer.deadline !== null ? index : -1).filter(index => index !== -1);
          if (runningRounds.length === 1) steps[panelIndex] = runningRounds[0] + 1;
          else if (saved.selectedScreen === undefined && pair.every(timer => timer.remaining === duration && timer.deadline === null)) steps[panelIndex] = 0;
        });
      }
    } catch {}
    const timerElements = [...document.querySelectorAll('.timer')];
    const sessionControl = document.getElementById('session-control');
    const screenOptions = program.map((screen, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.screen = index;
      if (screen.panel !== undefined) button.dataset.panel = screen.panel;
      button.textContent = screen.label;
      return button;
    });
    sessionControl.querySelector('.session-options').replaceChildren(...screenOptions);
    const sessionOptions = [...sessionControl.querySelectorAll('[data-panel]')];
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify({selectedPanel, selectedScreen, sequenceEnded, timers, steps})); } catch {}
    }
    function icon(button, name) {
      if (button.dataset.icon === name) return;
      button.dataset.icon = name;
      const placeholder = document.createElement('i');
      placeholder.dataset.lucide = name;
      button.replaceChildren(placeholder);
      lucide.createIcons();
    }
    function label(button, text) {
      button.title = text;
      button.setAttribute('aria-label', text);
    }
    function remaining(timer) {
      return timer.deadline === null ? timer.remaining : Math.min(duration, Math.max(0, timer.deadline - Date.now()));
    }
    function pauseTimers(panelIndex) {
      timers[panelIndex].forEach(timer => {
        timer.remaining = remaining(timer);
        timer.deadline = null;
      });
    }
    function refresh() {
      let changed = false;
      timers.forEach((pair, panelIndex) => {
        pair.forEach((timer, roundIndex) => {
          if (timer.deadline !== null && remaining(timer) === 0) {
            timer.deadline = null;
            timer.remaining = 0;
            changed = true;
            document.getElementById('announcement').textContent = `${panels[panelIndex].category}: rodada ${roundIndex + 1} encerrada.`;
          }
        });
      });
      const advanceButton = document.getElementById('advance');
      const backButton = document.getElementById('back');
      const panelScreen = program[selectedScreen].panel !== undefined;
      backButton.disabled = selectedScreen === 0 && steps[selectedPanel] === 0;
      label(backButton, sequenceEnded ? 'Voltar ao evento final' : panelScreen && steps[selectedPanel] > 0
        ? steps[selectedPanel] === 1 ? 'Voltar ao in\u00edcio da mesa' : 'Voltar \u00e0 rodada 1'
        : selectedScreen > 0 ? 'Voltar para ' + program[selectedScreen - 1].label : 'In\u00edcio do programa');
      if (program[selectedScreen].panel === undefined) {
        label(advanceButton, sequenceEnded ? 'Programa encerrado' : selectedScreen === program.length - 1 ? 'Encerrar programa' : 'Avan\u00e7ar para ' + program[selectedScreen + 1].label);
        advanceButton.disabled = sequenceEnded;
        if (changed) save();
        return;
      }
      timerElements.forEach((element, roundIndex) => {
        const timer = timers[selectedPanel][roundIndex];
        const timeLeft = remaining(timer);
        const seconds = Math.ceil(timeLeft / 1000);
        const running = timer.deadline !== null;
        const status = timeLeft === 0 ? 'finished' : running ? 'running' : timeLeft === duration ? 'ready' : 'paused';
        const statuses = {ready: 'Pronto', running: 'Em andamento', paused: 'Pausado', finished: 'Encerrado'};
        element.dataset.status = status;
        element.dataset.urgent = String(timeLeft > 0 && timeLeft <= 60000);
        element.querySelector('.clock').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        element.querySelector('.timer-status').textContent = statuses[status];
        element.querySelector('.timer-meter span').style.transform = `scaleX(${timeLeft / duration})`;
        const toggle = element.querySelector('.toggle-timer');
        toggle.disabled = timeLeft === 0;
        label(toggle, `${running ? 'Pausar' : 'Iniciar'} rodada ${roundIndex + 1}`);
        icon(toggle, running ? 'pause' : 'play');
        element.querySelector('.reset-timer').disabled = status === 'ready';
        document.getElementById(`round-${roundIndex}`).dataset.active = String(running);
      });
      const step = steps[selectedPanel];
      label(advanceButton, step < 2 ? `Iniciar bloco ${step + 1}` : 'Avan\u00e7ar para ' + program[selectedScreen + 1].label);
      advanceButton.disabled = false;
      if (changed) save();
    }
    function advance() {
      sessionControl.open = false;
      if (sequenceEnded) return;
      if (program[selectedScreen].panel === undefined) {
        if (selectedScreen < program.length - 1) selectScreen(selectedScreen + 1);
        else {
          sequenceEnded = true;
          document.getElementById('announcement').textContent = 'Programa encerrado.';
          save();
          refresh();
        }
        return;
      }
      const step = steps[selectedPanel];
      pauseTimers(selectedPanel);
      if (step < 2) {
        const timer = timers[selectedPanel][step];
        if (timer.remaining === 0) timer.remaining = duration;
        timer.deadline = Date.now() + timer.remaining;
        steps[selectedPanel] = step + 1;
      } else {
        selectScreen(selectedScreen + 1);
        return;
      }
      save();
      refresh();
    }
    function back() {
      sessionControl.open = false;
      if (selectedScreen === 0 && steps[selectedPanel] === 0) return;
      timers.forEach((pair, panelIndex) => pauseTimers(panelIndex));
      if (sequenceEnded) {
        sequenceEnded = false;
      } else if (program[selectedScreen].panel !== undefined && steps[selectedPanel] > 0) {
        steps[selectedPanel] = Math.min(steps[selectedPanel], 2) - 1;
      } else {
        const previous = program[selectedScreen - 1];
        if (previous.panel !== undefined) steps[previous.panel] = 2;
        selectScreen(selectedScreen - 1, false);
        return;
      }
      save();
      refresh();
    }
    function updateMotion() {
      document.getElementById('flow').src = `Lean/${panels[selectedPanel].flow}.${motionEnabled ? 'gif' : 'png'}?v=compact-strip-1`;
      const button = document.getElementById('motion');
      label(button, motionEnabled ? 'Pausar anima\u00e7\u00e3o' : 'Ativar anima\u00e7\u00e3o');
      icon(button, motionEnabled ? 'pause' : 'play');
    }
    function renderSpeakers(panel) {
      document.getElementById('participants').replaceChildren(...panel.speakers.map(speakerId => {
        const speaker = speakers[speakerId];
        const item = document.createElement('li');
        item.className = 'speaker';
        const photo = document.createElement('img');
        photo.className = 'speaker-photo';
        photo.src = `People/${speakerId}.png`;
        photo.alt = `Foto de ${speaker.name}`;
        photo.width = photo.height = 88;
        const info = document.createElement('div');
        info.className = 'speaker-info';
        const name = document.createElement('strong');
        name.className = 'speaker-name';
        name.textContent = speaker.name;
        const role = document.createElement('p');
        role.className = 'speaker-role';
        role.textContent = speaker.role;
        const company = document.createElement('img');
        company.className = 'speaker-company';
        company.src = `People/${speaker.logo}.png`;
        company.alt = speaker.company;
        company.dataset.monochrome = String(['siemens', 'engineering'].includes(speaker.logo));
        info.append(name, role, company);
        if (speaker.moderator) {
          const moderator = document.createElement('span');
          moderator.className = 'speaker-moderator';
          moderator.textContent = 'Modera\u00e7\u00e3o';
          info.prepend(moderator);
        }
        item.append(photo, info);
        return item;
      }));
    }
    function selectPanel(panelIndex, restartSequence = true) {
      selectedScreen = program.findIndex(screen => screen.panel === panelIndex);
      sequenceEnded = false;
      document.body.dataset.view = 'panel';
      document.getElementById('event-screen').hidden = true;
      document.getElementById('topic').setAttribute('aria-labelledby', 'theme');
      if (restartSequence) {
        pauseTimers(selectedPanel);
        if (panelIndex !== selectedPanel) pauseTimers(panelIndex);
        steps[panelIndex] = 0;
      }
      selectedPanel = panelIndex;
      const panel = panels[panelIndex];
      document.body.dataset.theme = panel.theme;
      renderSpeakers(panel);
      document.getElementById('session-name').textContent = sessionOptions[panelIndex].textContent;
      screenOptions.forEach((option, index) => option.setAttribute('aria-current', String(index === selectedScreen)));
      const title = document.createElement('strong');
      title.textContent = panel.title;
      const focus = document.createElement('span');
      focus.textContent = panel.focus;
      document.getElementById('theme').replaceChildren(title, ' ', focus);
      panel.questions.forEach((question, index) => { document.getElementById(`question-${index}`).textContent = question; });
      updateMotion();
      refresh();
      save();
    }
    function selectScreen(screenIndex, restartSequence = true) {
      const screen = program[screenIndex];
      if (screen.panel !== undefined) { selectPanel(screen.panel, restartSequence); return; }
      timers.forEach((pair, panelIndex) => pauseTimers(panelIndex));
      selectedScreen = screenIndex;
      if (restartSequence) sequenceEnded = false;
      document.body.dataset.view = 'event';
      document.body.dataset.theme = screen.theme;
      document.getElementById('topic').removeAttribute('aria-labelledby');
      const eventScreen = document.getElementById('event-screen');
      eventScreen.hidden = false;
      eventScreen.setAttribute('aria-label', screen.label);
      const image = document.getElementById('event-slide');
      image.src = `Events/slide-${screen.slide}.png`;
      image.alt = screen.label;
      document.getElementById('session-name').textContent = screen.label;
      screenOptions.forEach((option, index) => option.setAttribute('aria-current', String(index === selectedScreen)));
      refresh();
      save();
    }
    screenOptions.forEach(option => option.addEventListener('click', () => {
      selectScreen(Number(option.dataset.screen));
      sessionControl.open = false;
      document.getElementById('advance').focus({preventScroll: true});
    }));
    document.addEventListener('click', event => {
      if (!sessionControl.contains(event.target)) sessionControl.open = false;
    });
    sessionControl.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      event.preventDefault();
      sessionControl.open = false;
      document.getElementById('session').focus({preventScroll: true});
    });
    timerElements.forEach((element, roundIndex) => {
      element.querySelector('.toggle-timer').addEventListener('click', () => {
        const timer = timers[selectedPanel][roundIndex];
        const timeLeft = remaining(timer);
        if (timeLeft === 0) { refresh(); return; }
        if (timer.deadline !== null) {
          timer.remaining = timeLeft;
          timer.deadline = null;
        } else {
          pauseTimers(selectedPanel);
          timer.deadline = Date.now() + timeLeft;
          steps[selectedPanel] = roundIndex + 1;
        }
        save();
        refresh();
      });
      element.querySelector('.reset-timer').addEventListener('click', () => {
        if (!confirm(`Reiniciar a rodada ${roundIndex + 1} desta mesa em 10:00?`)) return;
        timers[selectedPanel][roundIndex] = {remaining: duration, deadline: null};
        steps[selectedPanel] = Math.min(steps[selectedPanel], roundIndex);
        save();
        refresh();
      });
    });
    document.getElementById('advance').addEventListener('click', advance);
    document.getElementById('back').addEventListener('click', back);
    document.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.repeat || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (!['ArrowRight', 'PageDown', 'ArrowLeft', 'PageUp'].includes(event.key)) return;
      if (event.target.closest('input, textarea, select, [contenteditable="true"], [role="dialog"]')) return;
      event.preventDefault();
      const goingBack = ['ArrowLeft', 'PageUp'].includes(event.key);
      if (sessionControl.contains(event.target)) document.getElementById(goingBack ? 'back' : 'advance').focus({preventScroll: true});
      if (goingBack) back();
      else advance();
    });
    document.getElementById('motion').addEventListener('click', () => { motionEnabled = !motionEnabled; updateMotion(); });
    reducedMotion.addEventListener('change', event => { motionEnabled = !event.matches; updateMotion(); });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { document.getElementById('announcement').textContent = 'Tela cheia indispon\u00edvel neste navegador.'; }
    });
    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen');
      const full = !!document.fullscreenElement;
      icon(button, full ? 'minimize' : 'maximize');
      label(button, full ? 'Sair da tela cheia' : 'Tela cheia');
    });
    document.addEventListener('visibilitychange', refresh);
    lucide.createIcons();
    selectScreen(selectedScreen, false);
    setInterval(refresh, 200);
  </script>
</body>
</html>
