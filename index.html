<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Media&#231;&#227;o | TRANSFORM 2026</title>
  <style>
    :root { --ink: #000028; --white: #fff; --mint: #00ffb9; --cyan: #64d8ff; --muted: #a7b3bd; --line: #30475d; --amber: #ffce70; --rose: #ffaaa8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--white); font-family: Arial, sans-serif; letter-spacing: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--mint); outline-offset: 5px; }
    button:disabled { opacity: .35; cursor: default; }
    .shell { max-width: 1500px; min-height: 100svh; margin: auto; padding: 0 52px; display: flex; flex-direction: column; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 110px; }
    .brand { display: flex; align-items: center; gap: 25px; }
    .brand img { width: 137px; height: auto; display: block; filter: brightness(0) invert(1); }
    .event { border-left: 1px solid var(--line); padding-left: 24px; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .event strong { display: block; color: var(--white); font-size: 13px; }
    .timer-tools { display: flex; align-items: center; gap: 20px; }
    .timers { display: flex; gap: 22px; }
    .timer { width: 145px; position: relative; padding-bottom: 7px; }
    .timer-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; font-size: 10px; color: var(--muted); }
    .timer-label strong { color: var(--white); font-weight: 400; }
    .timer-controls { display: flex; align-items: center; gap: 3px; }
    .clock { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; min-width: 78px; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 30px; height: 30px; border: 0; padding: 5px; background: transparent; border-radius: 3px; color: var(--muted); }
    .icon-button:hover { background: #ffffff10; color: var(--white); }
    .icon-button svg { width: 17px; height: 17px; stroke-width: 1.7; }
    .timer-meter { position: absolute; bottom: 0; width: 100%; height: 2px; background: var(--line); }
    .timer-meter span { display: block; height: 100%; width: 100%; background: var(--muted); transform-origin: left; }
    .timer[data-status="running"] .clock { color: var(--mint); }
    .timer[data-status="running"] .timer-meter span { background: var(--mint); }
    .timer[data-urgent="true"] .clock { color: var(--amber); }
    .timer[data-urgent="true"] .timer-meter span { background: var(--amber); }
    .timer[data-status="finished"] .clock { color: var(--rose); }
    main { flex: 1; display: flex; flex-direction: column; padding-top: 40px; }
    .session-picker { align-self: flex-start; max-width: 100%; color: var(--mint); background: var(--ink); border: 0; border-radius: 0; font: inherit; font-size: 14px; line-height: 1.5; margin: 0 0 18px; padding: 2px 6px 2px 0; cursor: pointer; }
    .session-picker:focus-visible { outline: 2px solid var(--mint); outline-offset: 5px; }
    h1 { font-size: 64px; font-weight: 400; line-height: 1.04; max-width: 1320px; margin: 0; text-wrap: balance; }
    h1 span { color: var(--mint); }
    .rounds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px; margin: 38px 0 30px; }
    .round { padding: 19px 0 0; border-top: 1px solid var(--line); }
    .round[data-active="true"] { border-color: var(--mint); }
    .round-head { display: flex; align-items: center; gap: 14px; }
    .round-number { color: var(--mint); font-size: 11px; }
    h2 { font-size: 13px; font-weight: 400; color: var(--muted); margin: 0; }
    .question { font-size: 19px; line-height: 1.5; margin: 15px 0 0; color: #e2e8eb; }
    .motion-band { margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 8px 0; }
    .flow-visual { position: relative; min-width: 0; padding-right: 38px; }
    .flow-visual > img { display: block; width: 100%; height: auto; max-height: 180px; object-fit: contain; aspect-ratio: 1200 / 180; }
    .motion-band .icon-button { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
    .audience { display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--white); font-size: 13px; text-decoration: none; line-height: 18px; }
    .audience img { display: block; width: 212px; height: 212px; background: white; image-rendering: pixelated; }
    .audience:focus-visible { outline: 2px solid var(--mint); outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; color: var(--muted); padding: 12px 0 22px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 1700px) { h1 { font-size: 76px; } .question { font-size: 23px; } main { padding-top: 40px; } .rounds { margin-top: 34px; } }
    @media (min-width: 1001px) and (max-height: 800px) { .masthead { min-height: 82px; } main { padding-top: 24px; } h1 { font-size: 52px; } .rounds { margin: 24px 0 18px; gap: 32px; } .question { font-size: 19px; line-height: 1.35; } .audience img { width: 159px; height: 159px; } }
    @media (max-width: 1000px) { .shell { padding: 0 28px; } .event { display: none; } h1 { font-size: 48px; } .rounds { gap: 28px; } .question { font-size: 18px; } }
    @media (max-width: 600px) {
      .shell { padding: 0 20px; } .masthead { padding: 22px 0; gap: 20px; flex-wrap: wrap; }
      .brand img { width: 114px; } .brand { flex: 1; } .timer-tools { display: contents; }
      .timers { order: 2; width: 100%; gap: 24px; } .timer { width: auto; flex: 1; }
      .timer-controls { gap: 0; } .clock { flex: 1; min-width: 60px; font-size: 24px; } .icon-button { width: 32px; height: 36px; }
      main { padding-top: 28px; } h1 { font-size: 38px; text-wrap: wrap; overflow-wrap: break-word; }
      .rounds { grid-template-columns: 1fr; gap: 26px; margin-top: 28px; } .question { font-size: 18px; }
      .motion-band { grid-template-columns: 1fr; gap: 20px; }
      .flow-visual { padding-right: 36px; }
      .audience { justify-self: center; }
      footer { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><img src="Logo-Siemens_original.png" width="1180" height="224" alt="Siemens"><div class="event"><strong>TRANSFORM 2026</strong>Beyond the Stage</div></div>
      <div class="timer-tools">
        <div class="timers" aria-label="Cron&#244;metros das rodadas">
          <section class="timer" data-round="0" data-status="ready" aria-label="Cron&#244;metro da rodada 1">
            <div class="timer-label"><strong>RODADA 1</strong><span class="timer-status">Pronto</span></div>
            <div class="timer-controls"><output class="clock" aria-label="Tempo restante da rodada 1" aria-live="off">10:00</output><button class="icon-button toggle-timer" type="button" title="Iniciar rodada 1" aria-label="Iniciar rodada 1"><i data-lucide="play"></i></button><button class="icon-button reset-timer" type="button" title="Reiniciar rodada 1" aria-label="Reiniciar rodada 1" disabled><i data-lucide="rotate-ccw"></i></button></div>
            <div class="timer-meter" aria-hidden="true"><span></span></div>
          </section>
          <section class="timer" data-round="1" data-status="ready" aria-label="Cron&#244;metro da rodada 2">
            <div class="timer-label"><strong>RODADA 2</strong><span class="timer-status">Pronto</span></div>
            <div class="timer-controls"><output class="clock" aria-label="Tempo restante da rodada 2" aria-live="off">10:00</output><button class="icon-button toggle-timer" type="button" title="Iniciar rodada 2" aria-label="Iniciar rodada 2"><i data-lucide="play"></i></button><button class="icon-button reset-timer" type="button" title="Reiniciar rodada 2" aria-label="Reiniciar rodada 2" disabled><i data-lucide="rotate-ccw"></i></button></div>
            <div class="timer-meter" aria-hidden="true"><span></span></div>
          </section>
        </div>
        <button id="advance" class="icon-button" type="button" title="Iniciar bloco 1" aria-label="Iniciar bloco 1" aria-keyshortcuts="ArrowRight PageDown"><i data-lucide="arrow-right"></i></button>
        <button id="fullscreen" class="icon-button" type="button" title="Tela cheia" aria-label="Tela cheia"><i data-lucide="maximize"></i></button>
      </div>
    </header>
    <main id="topic" aria-labelledby="theme" tabindex="0">
      <select id="session" class="session-picker" aria-label="Roda de conversa atual">
        <option value="0">Roda de Conversa T&#233;cnica 1</option>
        <option value="1">Roda de Conversa T&#233;cnica 2</option>
        <option value="2">Roda de Conversa Executiva 1</option>
        <option value="3">Roda de Conversa Executiva 2</option>
      </select>
      <h1 id="theme"></h1>
      <div class="rounds">
        <section class="round" id="round-0" aria-labelledby="round-title-0"><div class="round-head"><span class="round-number">01</span><h2 id="round-title-0">Realidade atual</h2></div><p class="question" id="question-0"></p></section>
        <section class="round" id="round-1" aria-labelledby="round-title-1"><div class="round-head"><span class="round-number">02</span><h2 id="round-title-1">Pr&#243;ximo est&#225;gio</h2></div><p class="question" id="question-1"></p></section>
      </div>
      <div class="motion-band">
        <div class="flow-visual"><img id="flow" width="1200" height="180" alt=""><button id="motion" class="icon-button" type="button" title="Pausar anima&#231;&#227;o" aria-label="Pausar anima&#231;&#227;o"><i data-lucide="pause"></i></button></div>
        <a class="audience" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=zTuuOHmV1E-t2rQuFJXVWsOqSYrJv9RMqsKWiKFg8zVUOFA1RFg0TDQ3UVBMVDhXVVBaWk1UV1k0OC4u&amp;origin=QRCode" target="_blank" rel="noopener noreferrer" aria-label="Enviar uma pergunta para a mesa-redonda, abre o formul&#225;rio em outra aba">
          <img src="qr_perguntas.png" width="424" height="424" alt="QR Code do formul&#225;rio de perguntas da plateia">
          <span>Envie sua pergunta</span>
        </a>
      </div>
    </main>
    <footer><span>BEYOND THE STAGE</span><span>5 NOV 2026</span></footer>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <script src="lucide.min.js"></script>
  <script>
    'use strict';
    const panels = [
      {
        category: 'T\u00e9cnica 1 / Sustenta\u00e7\u00e3o',
        title: 'Sustenta\u00e7\u00e3o de aplica\u00e7\u00f5es inteligentes:',
        focus: 'quem mant\u00e9m depois da entrega?',
        questions: [
          'O que dificulta manter a aplica\u00e7\u00e3o confi\u00e1vel e com respons\u00e1veis claros?',
          'Como evoluir aplica\u00e7\u00f5es e governan\u00e7a no ritmo do neg\u00f3cio?'
        ],
        flow: '01_sustentacao'
      },
      {
        category: 'T\u00e9cnica 2 / Dados e agentes',
        title: 'Dados, agentes e processos:',
        focus: 'est\u00e3o realmente conectados e contextualizados?',
        questions: [
          'O que impede a integra\u00e7\u00e3o dos dados entre sistemas?',
          'O que precisa mudar para transformar dados em contexto e intelig\u00eancia?'
        ],
        flow: '02_dados'
      },
      {
        category: 'Executiva 1 / Portf\u00f3lio e valor',
        title: 'Do caso de uso ao portf\u00f3lio:',
        focus: 'onde investir e onde parar',
        questions: [
          'Por que tantos pilotos de IA n\u00e3o chegam \u00e0 produ\u00e7\u00e3o?',
          'Como priorizar investimentos e manter s\u00f3 o que gera valor?'
        ],
        flow: '03_portfolio'
      },
      {
        category: 'Executiva 2 / Integra\u00e7\u00e3o sem ruptura',
        title: 'Integra\u00e7\u00e3o sem ruptura:',
        focus: 'estender o core ou substituir?',
        questions: [
          'No legado, o que limita a evolu\u00e7\u00e3o e o que deve ser preservado?',
          'Como modernizar a arquitetura sem interromper a opera\u00e7\u00e3o?'
        ],
        flow: '04_integracao'
      }
    ];
    const duration = 10 * 60 * 1000;
    const storageKey = 'transform2026-mediation-v1';
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let motionEnabled = !reducedMotion.matches;
    let selectedPanel = 0;
    let steps = panels.map(() => 0);
    let timers = panels.map(() => Array.from({length: 2}, () => ({remaining: duration, deadline: null})));
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && Number.isInteger(saved.selectedPanel) && saved.selectedPanel >= 0 && saved.selectedPanel < panels.length &&
          Array.isArray(saved.timers) && saved.timers.length === panels.length && saved.timers.every(pair =>
            Array.isArray(pair) && pair.length === 2 && pair.every(timer => timer && Number.isFinite(timer.remaining) && timer.remaining >= 0 && timer.remaining <= duration &&
              (timer.deadline === null || (Number.isFinite(timer.deadline) && timer.deadline > 0))))) {
        selectedPanel = saved.selectedPanel;
        timers = saved.timers;
        steps = Array.isArray(saved.steps) && saved.steps.length === panels.length && saved.steps.every(step => Number.isInteger(step) && step >= 0 && step <= 3)
          ? saved.steps
          : timers.map(pair => pair.reduce((step, timer, index) => timer.deadline !== null || timer.remaining < duration ? index + 1 : step, 0));
      }
    } catch {}
    const timerElements = [...document.querySelectorAll('.timer')];
    const sessionPicker = document.getElementById('session');
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify({selectedPanel, timers, steps})); } catch {}
    }
    function icon(button, name) {
      if (button.dataset.icon === name) return;
      button.dataset.icon = name;
      const placeholder = document.createElement('i');
      placeholder.dataset.lucide = name;
      button.replaceChildren(placeholder);
      lucide.createIcons();
    }
    function label(button, text) {
      button.title = text;
      button.setAttribute('aria-label', text);
    }
    function remaining(timer) {
      return timer.deadline === null ? timer.remaining : Math.min(duration, Math.max(0, timer.deadline - Date.now()));
    }
    function refresh() {
      let changed = false;
      timers.forEach((pair, panelIndex) => {
        pair.forEach((timer, roundIndex) => {
          if (timer.deadline !== null && remaining(timer) === 0) {
            timer.deadline = null;
            timer.remaining = 0;
            changed = true;
            document.getElementById('announcement').textContent = `${panels[panelIndex].category}: rodada ${roundIndex + 1} encerrada.`;
          }
        });
      });
      timerElements.forEach((element, roundIndex) => {
        const timer = timers[selectedPanel][roundIndex];
        const timeLeft = remaining(timer);
        const seconds = Math.ceil(timeLeft / 1000);
        const running = timer.deadline !== null;
        const status = timeLeft === 0 ? 'finished' : running ? 'running' : timeLeft === duration ? 'ready' : 'paused';
        const statuses = {ready: 'Pronto', running: 'Em andamento', paused: 'Pausado', finished: 'Encerrado'};
        element.dataset.status = status;
        element.dataset.urgent = String(timeLeft > 0 && timeLeft <= 60000);
        element.querySelector('.clock').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        element.querySelector('.timer-status').textContent = statuses[status];
        element.querySelector('.timer-meter span').style.transform = `scaleX(${timeLeft / duration})`;
        const toggle = element.querySelector('.toggle-timer');
        toggle.disabled = timeLeft === 0;
        label(toggle, `${running ? 'Pausar' : 'Iniciar'} rodada ${roundIndex + 1}`);
        icon(toggle, running ? 'pause' : 'play');
        element.querySelector('.reset-timer').disabled = status === 'ready';
        document.getElementById(`round-${roundIndex}`).dataset.active = String(running);
      });
      const advanceButton = document.getElementById('advance');
      const step = steps[selectedPanel];
      label(advanceButton, step < 2 ? `Iniciar bloco ${step + 1}` : step === 3 ? 'Mesa encerrada' : selectedPanel < panels.length - 1 ? 'Avan\u00e7ar para a pr\u00f3xima mesa' : 'Encerrar \u00faltima mesa');
      advanceButton.disabled = step === 3;
      if (changed) save();
    }
    function advance() {
      const step = steps[selectedPanel];
      if (step === 3) return;
      timers[selectedPanel].forEach(timer => {
        timer.remaining = remaining(timer);
        timer.deadline = null;
      });
      if (step < 2) {
        const timer = timers[selectedPanel][step];
        if (timer.remaining > 0) timer.deadline = Date.now() + timer.remaining;
        steps[selectedPanel] = step + 1;
      } else if (selectedPanel < panels.length - 1) {
        selectPanel(selectedPanel + 1);
        return;
      } else {
        steps[selectedPanel] = 3;
        document.getElementById('announcement').textContent = '\u00daltima mesa encerrada.';
      }
      save();
      refresh();
    }
    function updateMotion() {
      document.getElementById('flow').src = `Lean/${panels[selectedPanel].flow}.${motionEnabled ? 'gif' : 'png'}`;
      const button = document.getElementById('motion');
      label(button, motionEnabled ? 'Pausar anima\u00e7\u00e3o' : 'Ativar anima\u00e7\u00e3o');
      icon(button, motionEnabled ? 'pause' : 'play');
    }
    function selectPanel(panelIndex) {
      selectedPanel = panelIndex;
      const panel = panels[panelIndex];
      sessionPicker.value = String(panelIndex);
      const focus = document.createElement('span');
      focus.textContent = panel.focus;
      document.getElementById('theme').replaceChildren(panel.title + ' ', focus);
      panel.questions.forEach((question, index) => { document.getElementById(`question-${index}`).textContent = question; });
      updateMotion();
      refresh();
      save();
    }
    sessionPicker.addEventListener('change', () => selectPanel(Number(sessionPicker.value)));
    timerElements.forEach((element, roundIndex) => {
      element.querySelector('.toggle-timer').addEventListener('click', () => {
        const timer = timers[selectedPanel][roundIndex];
        const timeLeft = remaining(timer);
        if (timeLeft === 0) { refresh(); return; }
        if (timer.deadline !== null) {
          timer.remaining = timeLeft;
          timer.deadline = null;
        } else {
          timer.deadline = Date.now() + timeLeft;
          steps[selectedPanel] = Math.max(steps[selectedPanel] === 3 ? 0 : steps[selectedPanel], roundIndex + 1);
        }
        save();
        refresh();
      });
      element.querySelector('.reset-timer').addEventListener('click', () => {
        if (!confirm(`Reiniciar a rodada ${roundIndex + 1} desta mesa em 10:00?`)) return;
        timers[selectedPanel][roundIndex] = {remaining: duration, deadline: null};
        steps[selectedPanel] = Math.min(steps[selectedPanel], roundIndex);
        save();
        refresh();
      });
    });
    document.getElementById('advance').addEventListener('click', advance);
    document.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.repeat || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (!['ArrowRight', 'PageDown'].includes(event.key)) return;
      if (event.target !== sessionPicker && event.target.closest('input, textarea, select, [contenteditable="true"], [role="dialog"]')) return;
      event.preventDefault();
      if (event.target === sessionPicker) document.getElementById('advance').focus({preventScroll: true});
      advance();
    });
    document.getElementById('motion').addEventListener('click', () => { motionEnabled = !motionEnabled; updateMotion(); });
    reducedMotion.addEventListener('change', event => { motionEnabled = !event.matches; updateMotion(); });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { document.getElementById('announcement').textContent = 'Tela cheia indispon\u00edvel neste navegador.'; }
    });
    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen');
      const full = !!document.fullscreenElement;
      icon(button, full ? 'minimize' : 'maximize');
      label(button, full ? 'Sair da tela cheia' : 'Tela cheia');
    });
    document.addEventListener('visibilitychange', refresh);
    lucide.createIcons();
    selectPanel(selectedPanel);
    setInterval(refresh, 200);
  </script>
</body>
</html>
